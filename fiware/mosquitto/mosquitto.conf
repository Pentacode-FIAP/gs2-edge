# Broker local do Vizi
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# Ponte com o broker publico usado pelo Wokwi.
# O ESP32 simulado publica em broker.hivemq.com; a ponte assina os topicos
# dos sensores do Vizi e republica aqui, onde o IoT Agent escuta.
# Na AWS isso deixa de ser necessario: o Wokwi aponta direto para a EC2.
connection ponte-hivemq
address broker.hivemq.com:1883
bridge_protocol_version mqttv311
try_private false
cleansession true
# o HiveMQ publico derruba clientes que publicam em $SYS: sem notificacoes
notifications false
remote_clientid vizi-ponte-pentacode
keepalive_interval 60
start_type automatic
restart_timeout 10 30
topic /TEF/vizi001/attrs in 0
topic /TEF/vizi001/cmd out 0
